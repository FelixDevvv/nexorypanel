name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --distpath . NexoryPanel.spec
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash NexoryPanel.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  NexoryPanel.exe" | Set-Content -Path NexoryPanel.exe.sha256 -Encoding ascii
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: NexoryPanel ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            NexoryPanel.exe
            NexoryPanel.exe.sha256
