name: Build NexoryPanel desktop releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-latest
          - platform: linux
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Create macOS application icon
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          python -c "from PIL import Image; image = Image.open('static/icon.png').convert('RGBA'); image.thumbnail((900, 900), Image.Resampling.LANCZOS); canvas = Image.new('RGBA', (1024, 1024)); canvas.alpha_composite(image, ((1024 - image.width) // 2, (1024 - image.height) // 2)); canvas.save('static/icon-square.png')"
          mkdir -p static/icon.iconset
          sips -z 16 16 static/icon-square.png --out static/icon.iconset/icon_16x16.png >/dev/null
          sips -z 32 32 static/icon-square.png --out static/icon.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32 static/icon-square.png --out static/icon.iconset/icon_32x32.png >/dev/null
          sips -z 64 64 static/icon-square.png --out static/icon.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128 static/icon-square.png --out static/icon.iconset/icon_128x128.png >/dev/null
          sips -z 256 256 static/icon-square.png --out static/icon.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256 256 static/icon-square.png --out static/icon.iconset/icon_256x256.png >/dev/null
          sips -z 512 512 static/icon-square.png --out static/icon.iconset/icon_256x256@2x.png >/dev/null
          sips -z 512 512 static/icon-square.png --out static/icon.iconset/icon_512x512.png >/dev/null
          sips -z 1024 1024 static/icon-square.png --out static/icon.iconset/icon_512x512@2x.png >/dev/null
          iconutil -c icns static/icon.iconset -o static/icon.icns
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check shell launcher syntax
        if: matrix.platform == 'linux'
        run: bash -n start.sh
      - name: Build application
        run: pyinstaller --noconfirm --clean --distpath release-build NexoryPanel.spec
      - name: Package Windows release
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item release-build\NexoryPanel.exe release\NexoryPanel.exe
          $hash = (Get-FileHash release\NexoryPanel.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  NexoryPanel.exe" | Set-Content -Path release\NexoryPanel.exe.sha256 -Encoding ascii
      - name: Package macOS release
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          mkdir release
          ditto -c -k --sequesterRsrc --keepParent release-build/NexoryPanel.app release/NexoryPanel-macos.zip
          printf 'Built for %s\n' "$(uname -m)" > release/NexoryPanel-macos-architecture.txt
          (cd release && shasum -a 256 NexoryPanel-macos.zip > NexoryPanel-macos.zip.sha256)
      - name: Package Linux release
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p release/package
          install -m 755 release-build/NexoryPanel release/package/NexoryPanel
          cat > release/package/README.txt <<'EOF'
          NexoryPanel for Linux (x86_64)

          Requires a Java version supported by the selected Minecraft release.
          Run from a terminal with: ./NexoryPanel
          User data is stored in ${XDG_DATA_HOME:-~/.local/share}/nexorypanel.
          Set NEXORY_DATA_DIR to choose a different data directory.
          EOF
          tar -czf release/NexoryPanel-linux-x86_64.tar.gz -C release/package .
          (cd release && shasum -a 256 NexoryPanel-linux-x86_64.tar.gz > NexoryPanel-linux-x86_64.tar.gz.sha256)
      - name: Upload platform release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run Android tests and build APK
        working-directory: android
        run: ./gradlew --no-daemon :app:testReleaseUnitTest :app:assembleRelease
      - name: Package Android release
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/NexoryPanel-android.apk
          (cd release && sha256sum NexoryPanel-android.apk > NexoryPanel-android.apk.sha256)
      - name: Upload Android release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release/*
          if-no-files-found: error

  publish:
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download platform release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: NexoryPanel ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            release/NexoryPanel.exe
            release/NexoryPanel.exe.sha256
            release/NexoryPanel-macos.zip
            release/NexoryPanel-macos.zip.sha256
            release/NexoryPanel-macos-architecture.txt
            release/NexoryPanel-linux-x86_64.tar.gz
            release/NexoryPanel-linux-x86_64.tar.gz.sha256
            release/NexoryPanel-android.apk
            release/NexoryPanel-android.apk.sha256
